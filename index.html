<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabo — nobody has to ask</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1c1b18; --muted:#6b675e; --yes:#2e8b57; --no:#c0392b; --accent:#d97706; --line:#e6e0d2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  .top { max-width:1180px; margin:0 auto; padding:22px 20px 10px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .top h1 { margin:0; font-size:24px; }
  .top p { margin:4px 0 0; color:var(--muted); font-size:14px; max-width:620px; }
  .top .ctl { display:flex; gap:8px; }
  .top button { border:1px solid var(--line); background:#fff; padding:9px 14px; border-radius:999px; font-size:14px; cursor:pointer; }
  .top button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }

  .agent { max-width:1180px; margin:10px auto 0; padding:0 20px; }
  .agent .bar { background:#fff7e6; border-left:4px solid var(--accent); border-radius:8px; padding:10px 14px; font-size:14px; line-height:1.4; min-height:42px; }
  .agent .bar b { color:var(--accent); text-transform:uppercase; letter-spacing:.06em; font-size:11px; display:block; margin-bottom:2px; }

  .phones { max-width:1180px; margin:16px auto 30px; padding:0 20px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
  @media (max-width:900px) { .phones { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:480px) { .phones { grid-template-columns:1fr; } }

  .phone { background:#1c1b18; border-radius:28px; padding:10px; box-shadow:0 14px 34px rgba(0,0,0,.18); }
  .phone.you { outline:3px solid var(--accent); outline-offset:3px; }
  .screen { background:var(--bg); border-radius:20px; min-height:560px; display:flex; flex-direction:column; overflow:hidden; }
  .sh { padding:12px 14px 8px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
  .sh b { color:var(--ink); font-size:15px; }
  .sh .priv { font-size:11px; background:#e8e2d4; padding:3px 8px; border-radius:999px; }
  .body { padding:12px; display:flex; flex-direction:column; flex:1; }

  .card { background:var(--card); border-radius:16px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:6px; flex:1; }
  .card .tag { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .card h2 { margin:2px 0 0; font-size:21px; line-height:1.15; }
  .card .when { color:var(--muted); font-size:14px; }
  .card .why { margin-top:8px; background:#fff7e6; border-left:4px solid var(--accent); padding:10px 12px; border-radius:8px; font-size:13.5px; line-height:1.4; }
  .card .why small { display:block; color:var(--muted); margin-bottom:3px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .card .count { margin-top:auto; font-size:13px; color:var(--muted); padding-top:10px; }
  .card .fine { font-size:12px; color:var(--muted); line-height:1.35; border-top:1px solid var(--line); padding-top:8px; }

  .actions { display:flex; gap:12px; margin-top:12px; }
  .actions button { flex:1; height:50px; border-radius:14px; border:0; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.1); }
  .actions .no { background:#fff; color:var(--no); } .actions .yes { background:var(--yes); color:#fff; }
  .actions button:disabled { opacity:.35; cursor:default; box-shadow:none; }

  .state { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:10px; gap:8px; }
  .state h3 { margin:0; font-size:19px; }
  .state p { margin:0; color:var(--muted); font-size:13.5px; line-height:1.45; }
  .state .dot { width:14px; height:14px; border-radius:50%; margin:0 auto 6px; background:#e8e2d4; }
  .state .dot.wait { animation:pulse 1.2s infinite; background:var(--accent); }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.4);opacity:1} }

  .on { flex:1; display:flex; flex-direction:column; gap:8px; }
  .on .head { background:var(--yes); color:#fff; border-radius:14px; padding:12px 14px; }
  .on .head b { display:block; font-size:18px; }
  .on .head span { font-size:13px; opacity:.9; }
  .on h4 { margin:6px 0 0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .who { background:#fff; border-radius:12px; padding:9px 10px; display:flex; gap:10px; align-items:flex-start; }
  .who .av { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; font-size:15px; flex:none; }
  .who b { font-size:14px; display:block; }
  .who small { color:var(--muted); font-size:12px; line-height:1.35; display:block; }
  .on .fine { font-size:12px; color:var(--muted); margin-top:auto; line-height:1.35; }

  .pick { background:#fff; border-radius:12px; padding:9px 10px; display:flex; gap:10px; align-items:center; }
  .pick .av { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; font-size:14px; flex:none; }
  .pick .nm { flex:1; font-size:14px; font-weight:600; }
  .pick .nm small { display:block; font-weight:400; color:var(--muted); font-size:11.5px; }
  .pick button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .pick button.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  .send { margin-top:auto; height:46px; border-radius:14px; border:0; background:var(--ink); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .send:disabled { opacity:.35; }
  .next { background:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .next .tag { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--yes); font-weight:700; }
  .next h2 { margin:3px 0 2px; font-size:18px; }
  .next .when { color:var(--muted); font-size:13px; }
  .next .why { margin-top:8px; background:#eef7f1; border-left:4px solid var(--yes); padding:8px 10px; border-radius:8px; font-size:12.5px; line-height:1.4; }
  .ledger { max-width:1180px; margin:0 auto 40px; padding:0 20px; }
  .ledger h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .ledger ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .ledger li { background:#fff; border-radius:8px; padding:8px 12px; font-size:13px; display:flex; gap:12px; }
  .ledger li span { color:var(--muted); min-width:44px; font-variant-numeric:tabular-nums; }
  .ledger li.hid { color:var(--muted); font-style:italic; }
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>Nabo</h1>
    <p>Nobody has to ask. Nabo picks people who fit, proposes one thing to all of them the same way, and only says it's on when enough said yes. A no stays private.</p>
  </div>
  <div class="ctl">
    <button id="btnAuto" class="primary">Let the others answer</button>
    <button id="btnAfter" disabled>The morning after →</button>
    <button id="btnReset">Start over</button>
  </div>
</div>

<div class="agent"><div class="bar"><b>Nabo</b><span id="agentMsg"></span></div></div>

<div class="phones" id="phones"></div>

<div class="ledger">
  <h3>What Nabo told whom</h3>
  <ul id="ledger"></ul>
</div>

<script>
// Made-up people and a made-up event. Four phones; the left one is "you".
const EVENT = {
  tag: 'Friday · proposed to 4 people',
  title: 'Live jazz, then a drink',
  when: 'Fri 20:00 · a small jazz bar on Grünerløkka',
  need: 3,
};

const PEOPLE = [
  { id:'jonas', name:'Jonas', you:true,  color:'#d97706', bits:['New in Oslo since February','Jazz, cycling, cooking','Free most evenings'],
    why:'Three people who match your interests are going. Nobody organised this; Nabo proposed it to all four of you.' },
  { id:'sara',  name:'Sara',  color:'#2e8b57', bits:['Moved here last year','Plays piano, likes small venues','Sunday climber'],
    why:'Three people who like live music are going. You said you want to meet people outside work.' },
  { id:'erik',  name:'Erik',  color:'#5b6abf', bits:['Grew up in Oslo','Record collector','Shift worker, erratic weeks'],
    why:'Three people who match your interests are going. You said Fridays are your best night.' },
  { id:'amina', name:'Amina', color:'#b83280', bits:['Two years in Oslo','Jazz and photography','Says yes to walks'],
    why:'Three people who match your interests are going, one of them also into photography.' },
];

// In auto mode the others answer one by one. Erik says no.
const SCRIPT = [ {id:'sara', ok:true, t:900}, {id:'erik', ok:false, t:1900}, {id:'amina', ok:true, t:3000} ];

let answers = {};
let isOn = false;
let isDropped = false;
let phase = 'ask';          // 'ask' | 'after'
let picks = {};             // id -> array of ids they'd like to see again
let timers = [];

// The morning after, in auto mode. Sara picks Jonas and Amina; Amina picks only Sara.
const AFTER_SCRIPT = [ {id:'sara', ids:['jonas','amina'], t:900}, {id:'amina', ids:['sara'], t:2100} ];

// What Nabo proposes to a mutual pair. Keyed by sorted pair.
const PAIR_PLANS = {
  'jonas|sara':  { what:'Coffee',     when:'Tue 17:30 · near both your offices' },
  'amina|sara':  { what:'Walk',       when:'Sun 11:00 · Ekebergparken' },
  'amina|jonas': { what:'Photo walk', when:'Sat 12:00 · Bjørvika' },
};

const phones = document.getElementById('phones');
const ledger = document.getElementById('ledger');
const agentMsg = document.getElementById('agentMsg');
const btnAfter = document.getElementById('btnAfter');
const btnAuto = document.getElementById('btnAuto');

function log(text, hidden=false) {
  const li = document.createElement('li');
  const now = new Date();
  li.innerHTML = `<span>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span>${text}`;
  if (hidden) li.className = 'hid';
  ledger.appendChild(li);
}

function yesCount() { return Object.values(answers).filter(v => v === true).length; }
function noCount() { return Object.values(answers).filter(v => v === false).length; }
function went() { return PEOPLE.filter(q => answers[q.id] === true); }
function pairKey(a, b) { return [a, b].sort().join('|'); }
function mutual(a, b) { return (picks[a] || []).includes(b) && (picks[b] || []).includes(a); }
function allPicked() { return went().every(q => picks[q.id] !== undefined); }

function render() {
  phones.innerHTML = '';
  PEOPLE.forEach(p => {
    const el = document.createElement('div');
    el.className = 'phone' + (p.you ? ' you' : '');
    const a = answers[p.id];
    let body;
    if (phase === 'after') {
      if (a !== true) body = notThereScreen(p);
      else if (allPicked()) body = nextScreen(p);
      else if (picks[p.id] !== undefined) body = pickedWaitScreen(p);
      else body = afterScreen(p);
    }
    else if (isOn && a === true) body = onScreen(p);
    else if (a === true && isDropped) body = droppedScreen(p);
    else if (a === true) body = waitScreen(p);
    else if (a === false) body = noScreen(p);
    else if (isOn) body = missedScreen(p);
    else body = cardScreen(p);
    el.innerHTML = `<div class="screen">
      <div class="sh"><b>${p.name}${p.you ? ' (you)' : ''}</b><span class="priv">only ${p.name} sees this</span></div>
      <div class="body">${body}</div></div>`;
    phones.appendChild(el);
  });
  phones.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => decide(b.dataset.id, b.dataset.ok === '1'));
  phones.querySelectorAll('button[data-pick]').forEach(b => b.onclick = () => togglePick(b.dataset.me, b.dataset.pick, b));
  phones.querySelectorAll('button[data-send]').forEach(b => b.onclick = () => sendPicks(b.dataset.send));

  btnAfter.disabled = !(isOn && phase === 'ask');
  btnAuto.textContent = phase === 'after' ? 'Let the others pick' : 'Let the others answer';

  const y = yesCount(), n = noCount(), asked = PEOPLE.length - y - n;
  if (phase === 'after') {
    if (allPicked()) {
      const pairs = mutualPairs();
      agentMsg.textContent = pairs.length
        ? `${pairs.length} mutual pick${pairs.length > 1 ? 's' : ''}. Nabo proposes something to each pair, as if it were its own idea. Picks that were not mutual are never mentioned to anyone.`
        : `No mutual picks. Nobody is told. Nabo keeps proposing groups.`;
    } else agentMsg.textContent = `Saturday morning. Nabo asks the ${y} who went who they'd like to see again. A pick is only revealed if it is mutual.`;
  }
  else if (isOn) agentMsg.textContent = `It's on. ${y} said yes, so Nabo told those ${y} it's happening and who's coming. ${n ? `${n} said no and ${n === 1 ? 'is' : 'are'} simply not mentioned.` : ''}`;
  else if (isDropped) agentMsg.textContent = `Only ${y} said yes, needs ${EVENT.need}. Nabo drops it quietly. Nobody is told who said what, and nobody feels rejected.`;
  else if (asked === PEOPLE.length) agentMsg.textContent = `Asked all 4 the same way at the same time. Needs ${EVENT.need} yes to happen. Nobody is told what the others answered.`;
  else agentMsg.textContent = `${y} yes, ${n} no, ${asked} not answered yet. Still needs ${Math.max(0, EVENT.need - y)} more yes. Nobody is told this but you, the audience.`;
}

function mutualPairs() {
  const out = [];
  const g = went();
  for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++)
    if (mutual(g[i].id, g[j].id)) out.push([g[i].id, g[j].id]);
  return out;
}

function cardScreen(p) {
  return `<div class="card">
    <div class="tag">${EVENT.tag}</div>
    <h2>${EVENT.title}</h2>
    <div class="when">${EVENT.when}</div>
    <div class="why"><small>Why you, ${p.name}</small>${p.why}</div>
    <div class="count">About 4 people if it happens. You'll see who once it's on.</div>
    <div class="fine">Yes or no, no maybe. If you say no, nobody will know you were asked.</div>
  </div>
  <div class="actions">
    <button class="no" data-id="${p.id}" data-ok="0">No</button>
    <button class="yes" data-id="${p.id}" data-ok="1">Yes</button>
  </div>`;
}

function waitScreen(p) {
  return `<div class="state"><div class="dot wait"></div>
    <h3>You're in, if it happens</h3>
    <p>Nabo is asking the others the same way it asked you. You'll hear when it's on, and who's coming.</p>
    <p>Until then, nobody knows you said yes.</p></div>`;
}

function droppedScreen(p) {
  return `<div class="state"><div class="dot"></div>
    <h3>Not this Friday</h3>
    <p>Not enough people could make it. You are not told who, and they are not told you said yes.</p>
    <p>Nabo tries something else next week.</p></div>`;
}

function noScreen(p) {
  return `<div class="state"><div class="dot"></div>
    <h3>No worries</h3>
    <p>Nobody will know you were asked. Nabo will try something else another week.</p></div>`;
}

function missedScreen(p) {
  return `<div class="state"><div class="dot"></div>
    <h3>Nothing new</h3>
    <p>${p.name} never answered. Friday went ahead without them and they are not told.</p></div>`;
}

function onScreen(p) {
  const going = went();
  return `<div class="on">
    <div class="head"><b>Friday is on 🎷</b><span>${EVENT.when} · ${going.length} of you</span></div>
    <h4>Who's going</h4>
    ${going.map(q => `<div class="who"><div class="av" style="background:${q.color}">${q.name[0]}</div><div><b>${q.name}${q.id === p.id ? ' (you)' : ''}</b><small>${q.bits.join(' · ')}</small></div></div>`).join('')}
    <div class="fine">Nabo booked a table for ${going.length} and reminds everyone Friday afternoon. Nobody initiated this, so nobody is the host.</div>
  </div>`;
}

// ---- the morning after ----

function notThereScreen(p) {
  return `<div class="state"><div class="dot"></div>
    <h3>Nothing new</h3>
    <p>${p.name} wasn't there and isn't asked. Nabo will try something else another week.</p></div>`;
}

function afterScreen(p) {
  const others = went().filter(q => q.id !== p.id);
  return `<div class="on">
    <div class="head" style="background:var(--accent)"><b>How was Friday?</b><span>Who would you like to see again?</span></div>
    <h4>You went with</h4>
    ${others.map(q => `<div class="pick"><div class="av" style="background:${q.color}">${q.name[0]}</div><div class="nm">${q.name}<small>${q.bits[1]}</small></div><button data-me="${p.id}" data-pick="${q.id}">See again</button></div>`).join('')}
    <div class="fine">${p.name}, nobody sees your answer unless they picked you too. Picking no one is fine.</div>
    <button class="send" data-send="${p.id}">Done</button>
  </div>`;
}

function pickedWaitScreen(p) {
  const n = (picks[p.id] || []).length;
  return `<div class="state"><div class="dot wait"></div>
    <h3>Noted</h3>
    <p>You picked ${n === 0 ? 'no one' : n === 1 ? 'one person' : n + ' people'}. They don't know. If someone picked you too, Nabo will propose something to both of you, as if it were Nabo's idea.</p></div>`;
}

function nextScreen(p) {
  const mine = went().filter(q => q.id !== p.id && mutual(p.id, q.id));
  if (!mine.length) return `<div class="state"><div class="dot"></div>
    <h3>Nothing yet</h3>
    <p>No mutual pick this time. Nobody knows who you picked, or whether anyone picked you. Nabo keeps proposing groups.</p></div>`;
  return `<div class="on">
    <h4>New from Nabo</h4>
    ${mine.map(q => { const plan = PAIR_PLANS[pairKey(p.id, q.id)] || { what:'Coffee', when:'Tue 17:30' };
      return `<div class="next"><div class="tag">You both picked each other</div><h2>${plan.what} with ${q.name}</h2><div class="when">${plan.when}</div>
      <div class="why">${q.name} would like to see you again too. Nabo proposes this to both of you at once, as its own idea. A no is still private.</div></div>`; }).join('')}
    <div class="fine">Anyone you picked who didn't pick you is not mentioned, and never learns you picked them.</div>
  </div>`;
}

function togglePick(me, other, btn) {
  if (picks[me] !== undefined) return;
  btn.classList.toggle('sel');
  btn.textContent = btn.classList.contains('sel') ? 'See again ✓' : 'See again';
}

function sendPicks(me) {
  if (picks[me] !== undefined) return;
  const sel = [...phones.querySelectorAll(`button[data-me="${me}"].sel`)].map(b => b.dataset.pick);
  setPicks(me, sel);
}

function setPicks(me, ids) {
  if (picks[me] !== undefined) return;
  picks[me] = ids;
  const p = PEOPLE.find(x => x.id === me);
  const names = ids.map(i => PEOPLE.find(x => x.id === i).name);
  log(`${p.name} picked ${names.length ? names.join(' and ') : 'no one'}. Nabo told nobody.`, true);
  if (allPicked()) {
    mutualPairs().forEach(([a, b]) => {
      const A = PEOPLE.find(x => x.id === a).name, B = PEOPLE.find(x => x.id === b).name;
      const plan = PAIR_PLANS[pairKey(a, b)];
      log(`${A} and ${B} picked each other. Nabo proposes "${plan ? plan.what : 'Coffee'}, ${plan ? plan.when : 'Tue 17:30'}" to both, as its own idea.`);
    });
    went().forEach(q => (picks[q.id] || []).forEach(o => { if (!mutual(q.id, o)) log(`${q.name} picked ${PEOPLE.find(x => x.id === o).name}, not mutual. Neither is told.`, true); }));
  }
  render();
}

function decide(id, ok) {
  if (answers[id] !== undefined || isOn || phase !== 'ask') return;
  answers[id] = ok;
  const p = PEOPLE.find(x => x.id === id);
  log(`${p.name} said ${ok ? 'yes' : 'no'}. Nabo told nobody.`, true);
  if (yesCount() >= EVENT.need && noCount() + yesCount() === PEOPLE.length) turnOn();
  else if (Object.keys(answers).length === PEOPLE.length && yesCount() < EVENT.need) {
    isDropped = true;
    log(`To ${went().map(q => q.name).join(' and ')}: "Not this Friday, not enough could make it." Nobody is named.`);
  }
  render();
}

function turnOn() {
  isOn = true;
  const going = went().map(q => q.name);
  log(`To ${going.join(', ')}: "Friday is on. Here's who's coming." Sent to all ${going.length} at once.`);
  PEOPLE.filter(q => answers[q.id] === false).forEach(q => log(`To ${q.name}: nothing. They are not mentioned to the others.`, true));
}

function morningAfter() {
  if (!isOn) return;
  phase = 'after';
  log(`Saturday 10:00. To ${went().map(q => q.name).join(', ')}: "How was Friday? Who would you like to see again?" Answers are private.`);
  render();
}

function auto() {
  timers.forEach(clearTimeout); timers = [];
  if (phase === 'after') {
    AFTER_SCRIPT.forEach(s => { if (answers[s.id] === true && picks[s.id] === undefined) timers.push(setTimeout(() => setPicks(s.id, s.ids.filter(i => answers[i] === true)), s.t)); });
  } else {
    SCRIPT.forEach(s => { if (answers[s.id] === undefined) timers.push(setTimeout(() => decide(s.id, s.ok), s.t)); });
  }
}

function reset() {
  timers.forEach(clearTimeout); timers = [];
  answers = {}; isOn = false; isDropped = false; phase = 'ask'; picks = {}; ledger.innerHTML = '';
  log('Proposed "Live jazz, then a drink, Fri 20:00" to Jonas, Sara, Erik and Amina. Same message to each, nobody named as the initiator.');
  render();
}

btnAuto.onclick = auto;
btnAfter.onclick = morningAfter;
document.getElementById('btnReset').onclick = reset;
reset();
</script>
</body>
</html>
